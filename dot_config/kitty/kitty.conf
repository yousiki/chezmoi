# Kitty Terminal Configuration
# Translated from Ghostty config

# Opacity
background_opacity 0.9

# Clipboard
copy_on_select yes
clear_selection_on_copy yes

# Font
font_family Maple Mono NF CN

# Keybindings
map alt+backspace send_text all \x1b\x7f
map shift+enter send_text all \n

# macOS
macos_titlebar_style tabs
hide_window_decorations titlebar-only
window_padding_width 3

# Shell integration
shell_integration enabled

# Theme - Catppuccin (auto light/dark via dark-theme.auto.conf / light-theme.auto.conf)

# Tab bar
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 1
tab_title_template "{title}{'  :{}:'.format(num_windows) if num_windows > 1 else ''}"
