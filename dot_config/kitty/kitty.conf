# Kitty Terminal Configuration
# Translated from Ghostty config

# Opacity
background_opacity 0.9

# Clipboard
copy_on_select yes
clear_selection_on_copy yes

# Font
font_family Maple Mono NF CN

# Keybindings
map alt+backspace send_text all \x1b\x7f
map shift+enter send_text all \n

# macOS
macos_titlebar_style tabs

# Shell integration
shell_integration enabled

# Theme - Catppuccin (built-in since kitty 0.26.0)
# Run `kitty +kitten themes` to select and configure
# For auto light/dark: save as light/dark variants during selection
